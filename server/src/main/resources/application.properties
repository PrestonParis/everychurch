spring.application.name=everychurch

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/everychurch}
spring.datasource.username=${DATABASE_USERNAME:everychurch}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is Flyway-managed (server/src/main/resources/db/migration) — Hibernate only
# validates the mapped entities against what Flyway created, it never mutates schema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Both local dev's Postgres and the real Neon instance already have the schema
# ddl-auto=update created before this pass (see ARCHITECTURE.md "Database") — without
# baselining, Flyway would try to run V1's CREATE TABLEs against tables that already
# exist and fail immediately. baseline-on-migrate only ever acts on a database that (a)
# has no flyway_schema_history table yet AND (b) already has objects in it — it marks
# that existing schema as "already at V1" (matching V1's contents exactly) and applies
# V2 onward normally. A genuinely empty database (a fresh Testcontainers instance, a
# new teammate's first `docker compose up`) is unaffected: Flyway just runs V1 onward
# as usual, this setting never triggers.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# HS256 needs a secret of at least 32 bytes. The default below is fine for local dev
# only — every real environment must set JWT_SECRET explicitly.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeds one Platform Admin on startup if none exists (AdminUserSeeder). Change the
# password before deploying anywhere real.
admin.seed.email=${ADMIN_EMAIL:admin@everychurch.local}
admin.seed.password=${ADMIN_PASSWORD:change-me-now}

# Google Geocoding API — same provider as the Maps usage elsewhere in the brief.
# Left unset in dev/test on purpose: GoogleGeocodingService just skips geocoding
# (churches save without coordinates) rather than failing when there's no key.
google.geocoding.api-key=${GOOGLE_GEOCODING_API_KEY:}

# Google Maps Embed API key, handed to the client via GET /api/config (PublicConfigController).
# Safe to expose — it's restricted by HTTP referrer in Google Cloud Console, not by
# secrecy. Left unset in dev/test to hide the map rather than render a broken embed.
google.maps.embed-api-key=${GOOGLE_MAPS_EMBED_API_KEY:}

# Base URL of the Angular client, used to build absolute redirect targets (e.g. the
# volunteer field-kit's /r/nearest link) that can't rely on a relative /api proxy.
app.client-base-url=${CLIENT_BASE_URL:http://localhost:4200}

# Shared secret the scraper (apps/scraper) sends as the X-Scraper-Api-Key header when
# submitting discovered churches to /api/scraper/church-submissions — service-to-service
# auth, not a user JWT, since the scraper has no User row to log in as.
scraper.api-key=${SCRAPER_API_KEY:dev-only-insecure-scraper-key-change-me}

# Separate secret for the one-time Kaggle bulk-import script (Prompt 7,
# docs/SCRAPER.md "Bulk import") — deliberately not scraper.api-key, since bulk
# import writes Church rows directly (skipping the ChurchSubmission review queue)
# and should be independently revocable from day-to-day scraper discovery.
bulk-import.api-key=${BULK_IMPORT_API_KEY:dev-only-insecure-bulk-import-key-change-me}

# Forgot/reset password emails (SmtpMailService, built directly rather than through
# Spring Boot's mail auto-configuration — see that class). Left unset in dev/test on
# purpose: sendPasswordResetEmail logs the reset link instead of failing when there's
# no mail server configured, same pattern as geocoding/S3.
mail.host=${MAIL_HOST:}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:no-reply@everychurch.local}

# S3-backed image/sermon uploads (docs/ARCHITECTURE.md "Object Storage"). Credentials
# come from the AWS SDK's standard default chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# env vars, or an instance profile), not a custom property. Left unset in dev/test on
# purpose: S3PresignService returns a clear error rather than crashing when there's no
# bucket configured, same pattern as geocoding.
aws.s3.bucket-name=${S3_BUCKET_NAME:}
aws.region=${AWS_REGION:us-east-1}
