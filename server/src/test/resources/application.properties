# Datasource url/username/password are supplied at runtime by
# AbstractIntegrationTest's @DynamicPropertySource, pointed at a Testcontainers
# Postgres+PostGIS instance — there's no H2 equivalent for PostGIS/pg_trgm (Prompt 1).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=test-only-secret-not-for-real-use-0123456789abcdef
jwt.expiration-ms=86400000

admin.seed.email=admin@everychurch.local
admin.seed.password=test-admin-password-123

scraper.api-key=test-only-scraper-key-not-for-real-use
bulk-import.api-key=test-only-bulk-import-key-not-for-real-use
