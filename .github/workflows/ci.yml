name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx nx test client --runInBand
      - run: npx nx build client

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw test
        working-directory: server

  scraper:
    name: Scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pipx install poetry==2.2.1
      - run: poetry install --no-interaction
        working-directory: apps/scraper
      # The full suite is intentional: pyproject.toml enforces 100% coverage.
      - run: poetry run pytest tests/
        working-directory: apps/scraper
