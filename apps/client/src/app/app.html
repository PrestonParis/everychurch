<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a routerLink="/churches" class="text-xl font-bold tracking-tight text-slate-900 hover:text-slate-700 transition-colors">
      Every<span class="text-indigo-600">Church</span>
    </a>
    <div class="flex items-center gap-3 sm:gap-4">
      <a routerLink="/churches"
         class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors hidden sm:block">
        Browse
      </a>
      <a routerLink="/churches/new"
         aria-label="Add a church"
         class="inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="hidden sm:inline">Add Church</span>
      </a>

      @if (authService.currentUser()?.role === 'PLATFORM_ADMIN') {
        <div class="relative" (keydown.escape)="closeAdmin()">
          <button (click)="toggleAdmin()" [attr.aria-expanded]="adminOpen()" aria-haspopup="menu"
                  class="flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
            Admin
            <svg class="w-3.5 h-3.5 transition-transform" [class.rotate-180]="adminOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          @if (adminOpen()) {
            <div class="fixed inset-0 z-40" (click)="closeAdmin()"></div>
            <div role="menu" class="absolute right-0 top-full mt-2 z-50 w-52 py-1 rounded-xl bg-white ring-1 ring-slate-200 shadow-lg">
              <a role="menuitem" routerLink="/admin/claims" (click)="closeAdmin()" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Church claims</a>
              <a role="menuitem" routerLink="/admin/submissions" (click)="closeAdmin()" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Church submissions</a>
              <a role="menuitem" routerLink="/admin/volunteer-invites" (click)="closeAdmin()" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Volunteer invites</a>
              <a role="menuitem" routerLink="/admin/scraper-runs" (click)="closeAdmin()" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Scraper runs</a>
            </div>
          }
        </div>
      }

      @if (authService.isAuthenticated()) {
        <span class="text-sm text-slate-500 hidden sm:block">{{ authService.currentUser()?.email }}</span>
        <button (click)="logout()" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
          Log out
        </button>
      } @else {
        <a routerLink="/login" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
          Log in
        </a>
      }
    </div>
  </div>
</nav>

<router-outlet />
