<div class="min-h-screen bg-parchment flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-surface rounded-2xl ring-1 ring-hairline p-8">
    @if (submitted) {
      <h1 class="text-2xl font-serif font-semibold text-ink mb-2">Check your email</h1>
      <p class="text-sm text-ink-muted mb-6">
        If that email has an account, we've sent a link to reset the password. It expires in 1 hour.
      </p>
      <a routerLink="/login" class="text-oxblood font-medium text-sm hover:underline">← Back to log in</a>
    } @else {
      <h1 class="text-2xl font-serif font-semibold text-ink mb-1">Forgot your password?</h1>
      <p class="text-sm text-ink-muted mb-6">
        Enter your email and we'll send you a link to reset it.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-widest text-ink-muted mb-1.5">Email</label>
          <input formControlName="email" type="email" autocomplete="email"
                 class="w-full px-3 py-2 rounded-lg border border-hairline bg-surface text-sm text-ink focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent" />
        </div>

        @if (error) {
          <p class="text-sm text-red-700">{{ error }}</p>
        }

        <button type="submit" [disabled]="form.invalid || submitting"
                class="w-full py-2.5 rounded-lg bg-oxblood text-white text-sm font-semibold hover:bg-oxblood-dark disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          {{ submitting ? 'Please wait…' : 'Send reset link' }}
        </button>

        <a routerLink="/login" class="block text-center text-oxblood font-medium text-sm hover:underline">← Back to log in</a>
      </form>
    }
  </div>
</div>
