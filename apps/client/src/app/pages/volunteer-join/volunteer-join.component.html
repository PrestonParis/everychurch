<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl ring-1 ring-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Join as a volunteer</h1>
    <p class="text-sm text-slate-500 mb-6">
      You'll need an invite code from an EveryChurch admin — volunteer accounts aren't self-service.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-widest text-slate-400 mb-1.5">Invite code</label>
        <input formControlName="code" type="text" autocomplete="off"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-widest text-slate-400 mb-1.5">Display name</label>
        <input formControlName="displayName" type="text" autocomplete="name" placeholder="What other members will see"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-widest text-slate-400 mb-1.5">Email</label>
        <input formControlName="email" type="email" autocomplete="email"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-widest text-slate-400 mb-1.5">Password</label>
        <input formControlName="password" type="password" autocomplete="new-password"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      @if (error) {
        <p class="text-sm text-red-600">{{ error }}</p>
      }

      <button type="submit" [disabled]="form.invalid || submitting"
              class="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        {{ submitting ? 'Please wait…' : 'Redeem invite' }}
      </button>

      <p class="text-center text-sm text-slate-500">
        Not a volunteer? <a routerLink="/login" class="text-indigo-600 font-medium hover:underline">Log in</a>
        or <a routerLink="/register" class="text-indigo-600 font-medium hover:underline">register</a> instead.
      </p>
    </form>
  </div>
</div>
