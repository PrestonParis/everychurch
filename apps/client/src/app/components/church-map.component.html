@if (hasLocation) {
  <div class="bg-white rounded-2xl ring-1 ring-slate-200 p-6">
    <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-4">Location</h2>

    @if (embedUrl) {
      <div class="rounded-xl overflow-hidden ring-1 ring-slate-200 mb-4" style="aspect-ratio: 4 / 3;">
        <iframe
          [src]="embedUrl"
          class="w-full h-full border-0"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Map showing this church's location">
        </iframe>
      </div>
    }

    @if (directionsUrl) {
      <a [href]="directionsUrl" target="_blank" rel="noopener"
         class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-3V7m6 10l4.553 2.276A1 1 0 0021 16.382V5.618a1 1 0 00-.553-.894L15 2m0 15V2m0 0L9 5"/>
        </svg>
        Get Directions
      </a>
    }
  </div>
}
