<span
  class="inline-flex items-center justify-center rounded-full flex-shrink-0"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.backgroundColor]="background()"
>
  <svg
    [style.width.px]="emblemSize()"
    [style.height.px]="emblemSize()"
    viewBox="0 0 24 24"
    fill="none"
    [attr.stroke]="style().color"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    @switch (style().icon) {
      @case ('openBookWave') {
        <path d="M4 6.5c2-1 5-1 8 1 3-2 6-2 8-1v9c-2-1-5-1-8 1-3-2-6-2-8-1v-9z" />
        <path d="M12 7.5v9" />
        <path d="M12 15.5c1.6 1.8 2.4 3 2.4 4a2.4 2.4 0 11-4.8 0c0-1 .8-2.2 2.4-4z" />
      }
      @case ('crossPlain') {
        <path d="M12 3v18M7.5 8h9" />
      }
      @case ('chalice') {
        <path d="M6.5 4.5h11" />
        <path d="M7 4.5c0 4.2 1.8 6.8 5 6.8s5-2.6 5-6.8" />
        <path d="M12 11.3V18" />
        <path d="M8.5 20.5h7" />
        <path d="M9.7 18h4.6l.7 2.5H9l.7-2.5z" />
      }
      @case ('crossThreeBar') {
        <path d="M12 3v18M9 7h6M6 11h12M9 17l6-2" />
      }
      @case ('crossPotent') {
        <path d="M12 3v18M6 11h12" />
        <path d="M9.8 3h4.4" />
        <path d="M9.8 21h4.4" />
        <path d="M6 8.8v4.4" />
        <path d="M18 8.8v4.4" />
      }
      @case ('crossRadiant') {
        <path d="M12 6v16M8.5 11h7" />
        <path d="M12 2c1.6 1.6 2.2 2.6 2.2 3.6a2.2 2.2 0 01-4.4 0c0-1 .6-2 2.2-3.6z" />
      }
      @case ('temple') {
        <path d="M5 20V11l7-6 7 6v9" />
        <path d="M9 20v-5h6v5" />
        <path d="M12 5V2M12 2l-1 1.2M12 2l1 1.2" />
      }
      @case ('lutherRose') {
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.2c-2.6 0-4.3 2.1-4.3 4.3 0 3.3 4.3 6.3 4.3 6.3s4.3-3 4.3-6.3c0-2.2-1.7-4.3-4.3-4.3z" />
        <path d="M12 8.5v6M9.3 11.5h5.4" />
      }
      @case ('crossFlame') {
        <path d="M12 5v17M8.5 10.5h7" />
        <path d="M6 6.5c-1.1 1.2-1.5 2.1-1.5 3a1.5 1.5 0 003 0c0-.5-.2-.9-.6-1.1.1.5-.2.8-.5.8-.4 0-.6-.5-.2-.9.6-.7.3-1.3-.2-1.8z" />
        <path d="M18 6.5c1.1 1.2 1.5 2.1 1.5 3a1.5 1.5 0 01-3 0c0-.5.2-.9.6-1.1-.1.5.2.8.5.8.4 0 .6-.5.2-.9-.6-.7-.3-1.3.2-1.8z" />
      }
      @case ('chapel') {
        <path d="M5 20v-8l7-5 7 5v8" />
        <path d="M10 20v-4h4v4" />
        <path d="M5 20h14" />
      }
      @case ('flame') {
        <path d="M12 3c-4.2 4.4-5.5 7.7-5.5 10.8a5.5 5.5 0 0011 0c0-1.9-.7-3.1-1.9-4.2.4 1.8-.5 2.9-1.7 2.9-1.5 0-2.1-1.6-1-3.2C14.6 8 13.9 5.6 12 3z" />
      }
      @case ('crossCeltic') {
        <path d="M12 3v18M6 11h12" />
        <circle cx="12" cy="11" r="4.2" />
      }
      @case ('openBookRays') {
        <path d="M4 9c2-1 5-1 8 1 3-2 6-2 8-1v9c-2-1-5-1-8 1-3-2-6-2-8-1V9z" />
        <path d="M12 10v9" />
        <path d="M12 3v2.5M9 4.5l1.3 2M15 4.5l-1.3 2" />
      }
      @case ('compassStar') {
        <path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7z" />
      }
    }
  </svg>
</span>
