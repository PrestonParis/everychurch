[tool.coverage.run]
branch = true
source = [ "scraper" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:', 'if __name__ == .__main__.:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=100 --cov-report html:'../../coverage/apps/scraper/html' --cov-report xml:'../../coverage/apps/scraper/coverage.xml' --junitxml='../../reports/apps/scraper/unittests/junit.xml' --html='../../reports/apps/scraper/unittests/html/index.html'"

[tool.poetry]
name = "everychurch.scraper"
version = "1.0.0"
description = "AWS Lambda worker for scraping and processing church data"
authors = [ ]
license = 'MIT'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "scraper"

  [tool.poetry.dependencies]
  # Raised from >=3.8 to >=3.9: kagglehub (Prompt 7) requires Python >=3.9.
  python = ">=3.9,<3.11"
  requests = "^2.31.0"
  beautifulsoup4 = "^4.12.0"
  kagglehub = "^0.3.0"
  pandas = "^2.0.0"

  [tool.poetry.dev-dependencies]
  pytest = "^7.4.0"
  pytest-cov = "^4.1.0"
  pytest-html = "^4.0.0"
  responses = "^0.24.0"

[build-system]
requires = ["poetry-core==1.1.0"]
build-backend = "poetry.core.masonry.api"
